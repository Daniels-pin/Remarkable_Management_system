# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: remarkable-api
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Comma-separated Vercel URL(s), e.g. https://your-app.vercel.app
      # Required when the frontend calls the API directly. With the Next.js
      # API proxy (API_PROXY_TARGET on Vercel), browser traffic is same-origin
      # and CORS is only needed for non-proxied clients.
      - key: CORS_ORIGINS
        sync: false
