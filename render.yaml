# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: remarkable-api
    runtime: python
    buildCommand: bash scripts/render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Comma-separated Vercel URL(s), e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
